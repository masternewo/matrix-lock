name: Build
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pygame==2.5.2 pyinstaller==6.10.1
          python -c "import pygame; print('pygame', pygame.version.ver)"

      - name: Verify syntax
        run: python -m py_compile main.py set_password.py build.py

      - name: Build EXE
        run: python -m PyInstaller --onefile --noconsole --clean --name MatrixLock main.py

      - name: Check dist
        shell: cmd
        run: dir dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MatrixLock-win64
          path: dist/MatrixLock.exe
          if-no-files-found: error
