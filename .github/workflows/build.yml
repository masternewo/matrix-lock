name: Build MatrixLock EXE
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pygame==2.5.2
          pip install pyinstaller==6.10.1
      - name: Verify syntax
        run: |
          python -m py_compile main.py
          python -m py_compile set_password.py
          python -m py_compile build.py
      - name: Build EXE
        run: pyinstaller --onefile --noconsole --clean --name MatrixLock main.py
      - name: Show dist
        run: dir dist
        shell: cmd
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MatrixLock-win64
          path: dist/MatrixLock.exe
          if-no-files-found: error
