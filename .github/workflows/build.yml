name: Build MatrixLock
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install pygame==2.5.2 pyinstaller==6.10.1
          python -c "import pygame; print('pygame', pygame.version.ver)"
          python -c "import PyInstaller; print('PyInstaller', PyInstaller.__version__)"

      - name: Verify syntax
        run: |
          python -m py_compile main.py
          python -m py_compile set_password.py
          python -m py_compile build.py
          echo syntax OK

      - name: Build EXE
        run: python -m PyInstaller --onefile --noconsole --clean --name MatrixLock main.py --log-level=WARN

      - name: Show dist contents
        if: always()
        shell: cmd
        run: |
          echo === current dir ===
          dir
          echo === dist ===
          if exist dist (dir dist /s) else (echo NO dist folder)

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MatrixLock-win64
          path: dist/MatrixLock.exe
          if-no-files-found: warn
