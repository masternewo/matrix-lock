name: Build EXE
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pygame==2.5.2
          pip install pyinstaller==5.5

      - name: Verify
        run: python -m py_compile main.py set_password.py build.py

      - name: Build
        run: pyinstaller --onefile --noconsole --clean --name MatrixLock main.py

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: MatrixLock-exe
          path: dist/MatrixLock.exe
          if-no-files-found: error
