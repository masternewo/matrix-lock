name: Build
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pygame==2.5.2 pyinstaller==6.10.1
      - name: Check
        run: python -m py_compile main.py
      - name: Build
        run: pyinstaller --onefile --noconsole --clean --name MatrixLock main.py
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: MatrixLock-win64
          path: dist/MatrixLock.exe
          if-no-files-found: error
