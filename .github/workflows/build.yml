name: Build MatrixLock EXE
on:
  push:
    branches: [ main ]
    paths: [ 'main.py', 'requirements.txt', 'build.py', '.github/workflows/build.yml' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build EXE
        run: |
          python -m PyInstaller --onefile --noconsole --name MatrixLock main.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MatrixLock-win64
          path: dist/MatrixLock.exe
      - name: Create Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0-${{ github.run_number }}
          name: Matrix Lock v2.0 Build ${{ github.run_number }}
          files: dist/MatrixLock.exe
          generate_release_notes: true
