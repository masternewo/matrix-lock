name: Build MatrixLock
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install base dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install pyinstaller==6.10.1
          python -c "import pygame; print('pygame', pygame.version.ver)"
          python -c "import PyInstaller; print('pyinstaller', PyInstaller.__version__)"
          python -c "import sys; print(sys.version)"

      - name: Verify syntax
        run: python -m py_compile main.py set_password.py build.py

      - name: Build EXE
        run: pyinstaller --onefile --noconsole --clean --name MatrixLock main.py --log-level=WARN

      - name: List dist
        if: always()
        shell: cmd
        run: |
          echo === dir ===
          dir
          echo === dist ===
          if exist dist ( dir dist /s ) else ( echo NO dist folder! )

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MatrixLock-win64
          path: dist/MatrixLock.exe
          if-no-files-found: warn
